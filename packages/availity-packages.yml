providerId: availity
summary: >-
  Availity publishes an actively-maintained first-party JavaScript estate on npm under the
  @availity scope, split across two monorepos: sdk-js (API/runtime helpers for calling Availity
  services from a browser app) and element (the Availity Element design system). There is no
  first-party server-side SDK for the Availity REST APIs in Python, Java, .NET, Go, Ruby, PHP or
  Rust — the API Guide teaches raw cURL against https://api.availity.com and nothing else.
  Registry check date 2026-08-14; every package below answered registry.npmjs.org unauthenticated.
notes:
  - >-
    IMPORTANT SCOPE CAVEAT: these packages are client-side helpers for applications running inside
    the Availity Essentials portal (axios wrappers, auth/session plumbing, analytics, file upload,
    form validation, UI components). They are NOT generated clients for the public HIPAA
    Transactions REST APIs documented at developer.availity.com. @availity/api-core /
    @availity/api-axios are the closest thing to an API SDK and are described by Availity as
    "Base API definitions for the Availity REST API".
  - >-
    Release cadence is healthy: the sdk-js monorepo published a coordinated 2026-06-15 release
    across every package, and @availity/element shipped 2026-08-05 — nine days before this check.
    No abandonment signal.
  - >-
    @availity/uikit is referenced by the availity-uikit GitHub repo but returns HTTP 404 from
    registry.npmjs.org under the @availity scope; recorded below with version null.
