  baseURL: https://api.availity.com
  properties:
  - url: https://developer.availity.com/blog
    type: Documentation
  - url: https://developer.availity.com/partner/gettingstarted
    type: GettingStarted
  description: >-
    The Availity Patient Cost Estimator API enables healthcare providers and institutions to estimate
    service costs before delivery for both institutional and professional services. REST APIs support
    version 1.0.0 and 2.0.0 and include predetermination requests across all major health plan payers,
    helping meet price transparency requirements.
