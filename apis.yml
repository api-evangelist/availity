    type: Documentation
  - url: https://developer.availity.com/partner/gettingstarted
    type: GettingStarted
  description: >-
    The Availity Healthcare HIPAA Transactions API provides a unified interface for standard HIPAA EDI
    transactions. REST APIs enable healthcare providers and vendors to submit and receive X12 EDI transactions
    across payers including eligibility, claims, remittance, authorizations, and referrals. Quota: 100,000
    calls per day, 100 calls per second rate limit.
- aid: availity:availity-patient-cost-estimator-api
  name: Availity Patient Cost Estimator API
  tags:
  - Cost Estimation
  - Healthcare
  - Patient Financial Responsibility
  - Price Transparency
  image: https://raw.githubusercontent.com/api-evangelist/availity/refs/heads/main/image.png
