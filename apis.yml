    type: Documentation
  - url: https://developer.availity.com/partner/gettingstarted
    type: GettingStarted
  description: >-
    The Availity Eligibility & Benefits Value-Add APIs provide supplementary data during eligibility transactions.
    The Care Reminders API retrieves real-time care gap information from multiple payers. The Member ID
    Card API retrieves digital member ID cards in PDF or PNG format during eligibility verification workflows.
