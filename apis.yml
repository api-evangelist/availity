description: >-
  Availity is a healthcare information network and clearinghouse providing REST APIs for real-time HIPAA EDI
  transactions. The platform processes over 11 billion annual healthcare transactions connecting providers, health
  plans, and vendors nationwide. Create your application and subscribe to a plan to make use of Availity APIs for
  eligibility verification, claims management, prior authorization, and patient cost estimation.

