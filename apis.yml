  - type: Features
    data:
      - name: OAuth 2.0 Authentication
        description: Client credentials grant flow with 5-minute token expiration and HTTPS/TLS encryption for secure API access.
      - name: Real-Time EDI Transactions
        description: >-
          Processing over 8.8 million daily transactions and 11 billion annual healthcare transactions across all major
          health plans.
      - name: Nationwide Payer Network
        description: Access to every major health plan nationwide and over 1 million providers through the Availity clearinghouse.
      - name: Multi-Format Responses
        description: >-
          Returns JSON and XML representations including errors using HTTP response codes. Supports CSV, PDF, PNG, and
          XLS for specific endpoints.
      - name: Cursor-Based Pagination
        description: >-
          Collection resources support offset/limit pagination with limit range of 1-50 items per request with link
          relations.
      - name: Mock/Sandbox Testing
        description: >-
          Demo subscriptions support custom response selection via X-Api-Mock-Scenario-ID and X-Api-Mock-Response
          headers.
      - name: Rate Limiting
        description: Standard tier provides 100,000 calls per day and 100 calls per second for HIPAA transaction APIs.
      - name: ASC X12 EDI Standards
        description: >-
          Full support for HIPAA EDI version 005010 transactions including 270/271, 276/277, 278, and 835 transaction
          sets.
  - type: UseCases
    data:
      - name: Real-Time Eligibility Verification
        description: >-
          Verify patient insurance coverage, co-pays, deductibles, and benefits in real time before scheduling or
          rendering services.
      - name: Claim Status Tracking
        description: >-
          Track submitted claims through adjudication, checking ACKNOWLEDGED, PENDING, PAID, DENIED, and ADJUSTED
          statuses.
      - name: Prior Authorization Management
        description: >-
          Submit and track prior authorization requests using X12 278 transactions to check if authorization is required
          before service delivery.
      - name: Patient Cost Estimation
        description: >-
          Estimate patient out-of-pocket costs before services are rendered to meet price transparency requirements and
          inform patients.
      - name: Electronic Claim Attachments
        description: >-
          Electronically attach clinical documentation to claims and authorizations, reducing manual faxing and
          accelerating adjudication.
      - name: Care Gap Identification
        description: >-
          Retrieve real-time care reminders during eligibility checks to identify preventive care gaps and coordinate
          outreach.
      - name: Digital Member ID Cards
        description: >-
          Retrieve member ID cards digitally during eligibility verification, reducing administrative burden and
          improving patient experience.
      - name: Multi-Payer Data Consolidation
        description: >-
          Connect to all major payers through a single clearinghouse API rather than managing individual payer
          connections.
  - type: Integrations
    data:
      - name: EHR Systems
        description: >-
          Integrates with electronic health record systems to embed eligibility and claims workflows into clinical
          workflows.
      - name: Practice Management Systems
        description: Connects practice management software to payer networks for revenue cycle management and claims processing.
      - name: Revenue Cycle Management Platforms
        description: >-
          Integrates with RCM platforms to automate eligibility verification, claim submission, and payment
          reconciliation.
      - name: Blue Cross Blue Shield Plans
        description: Direct integration with BCBS plans nationwide for eligibility, claims, and prior authorization transactions.
      - name: Humana
        description: Integration with Humana for care reminders, eligibility verification, and claims processing.
      - name: Molina Healthcare
        description: Integration with Molina Healthcare for eligibility and benefits verification and care reminders.
      - name: Florida Blue
        description: Integration with Florida Blue for care reminders and real-time eligibility verification.
      - name: Healthfirst New York
        description: Integration with Healthfirst New York for eligibility and care gap identification.
  - type: ArazzoWorkflows
    workflows:
    - url: arazzo/availity-claim-attachment-workflow.yml
      name: Availity Claim Attachment (X12 275)
      summary: "Submit an X12 275 claim attachment, then poll for its processing status until the payer accepts it."
    - url: arazzo/availity-claim-status-inquiry-workflow.yml
      name: Availity Claim Status Inquiry (X12 276/277)
      summary: "Submit an X12 276 claim status request, then poll for the X12 277 claim status response until the payer finalizes it."
    - url: arazzo/availity-eligibility-benefits-workflow.yml
      name: Availity Eligibility and Benefits (X12 270/271)
      summary: "Locate a payer that supports the 270 transaction, submit an X12 270 eligibility request, then retrieve the resulting 271 benefit response."
    - url: arazzo/availity-prior-authorization-workflow.yml
      name: Availity Prior Authorization (X12 278)
      summary: "Determine whether authorization is required, create the X12 278 service review, attach supporting clinical documentation, then read back the authorization decision."
