summary: >-
  Availity publishes NO first-party MCP server. This file is a DERIVED CANDIDATE tool surface,
  computed one-tool-per-operationId from the eleven first-party Swagger 2.0 documents Availity
  serves from its developer portal. Nothing here is reachable by an agent today: there is no
  endpoint to POST to and no package to install. It exists so the tool surface an Availity MCP
  server would expose is documented and reviewable, and so the absence is recorded as a measured
  absence rather than an unchecked gap.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: oauth
  verified: searched
discovery:
  searched:
    - target: developer.availity.com documentation, blog and product catalogue
      result: no MCP server, no /mcp endpoint, no agent tooling referenced
    - target: https://github.com/availity (public GitHub organization)
      result: no MCP server repository
    - target: npm @availity scope
      result: >-
        21 published packages, all browser/portal helpers and UI components. No @availity/mcp,
        no MCP server package.
    - target: web search for "Availity MCP server"
      result: no first-party or credible third-party Availity MCP server found
  probed:
    - url: https://api.availity.com/mcp
      status: 401
      note: >-
        The api.availity.com gateway answers HTTP 401 "Unauthorized" (12 bytes, text/plain) for
        EVERY path including paths that do not exist, so this 401 is NOT evidence that an MCP
        endpoint exists. Recorded to show the probe ran and cannot distinguish.
auth_model:
  note: >-
    Any Availity MCP server would have to carry OAuth 2.0 client-credentials with a 300-second
    token lifetime and a product+plan scope pair — see authentication/availity-authentication.yml
    and scopes/availity-scopes.yml. Every tool below is PHI-bearing and would require a signed
    trading-partner agreement and a BAA before it could touch production data.
agent_caveats:
  - >-
    ASYNC: most write tools answer HTTP 202 Accepted, and the follow-up read ALSO answers 202
    while the payer response is still pending. An MCP tool wrapping these operations must model
    "not finished, poll again" or an agent will read 202 as success. See
    conventions/availity-conventions.yml#async_model.
  - >-
    NO IDEMPOTENCY: Availity publishes no idempotency-key header. A retried submit tool can
    produce a duplicate claim or duplicate authorization request. Any MCP server over this API
    needs a client-side dedupe contract keyed on the payer-assigned identifier.
  - >-
    NO RATE-LIMIT HEADERS: exhaustion is a bare 429 with no X-RateLimit-*/RateLimit-*/Retry-After,
    so a tool loop has no runtime budget signal.
