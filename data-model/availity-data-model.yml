summary: >-
  The entity-relationship graph of Availity's public REST surface, derived mechanically from the
  `definitions` blocks of the eleven first-party Swagger 2.0 documents Availity publishes. Every
  entity, field count, identifier field and relationship below was read out of Availity's own
  documents; nothing is inferred from prose.
shape_notes:
  - >-
    THERE IS NO SHARED MODEL ACROSS PRODUCTS. Each Availity API document defines its OWN copy of
    the common healthcare entities — Patient, Payer, Provider, Subscriber, Submitter, ServiceLine,
    Diagnosis, Note, ErrorResponse, FieldError, Link, ResultSet all recur, with DIFFERENT field
    sets, in Coverages, Claim Statuses, Service Reviews and Dental Claims. There is no
    `components.schemas` reuse across products because each document is generated per product by
    the gateway. A client cannot write one Payer type and reuse it; it needs a per-product type.
  - >-
    NO CROSS-RESOURCE ID GRAPH. Availity's resources are TRANSACTION envelopes, not persistent
    domain objects. A Coverage does not reference a Claim, a ClaimStatus does not reference a
    ServiceReview, and there is no customer/account object at the root. The only durable
    identifier is the per-transaction `id` returned by a POST, which is then polled on the GET.
    Correlation across transactions is done on X12 business identifiers carried INSIDE the payload
    (member id, control number, patientAccountNumber, payer claim number), not on API-level ids.
  - >-
    THE ROOT ENTITIES ARE THE X12 TRANSACTIONS. Coverage (270/271), ClaimStatus (276/277),
    ServiceReview (278), DentalClaim, InstitutionalClaim, ProfessionalClaim /
    ProfessionalPCERequest, Configuration and Payer. Everything else hangs off one of these.
  - >-
    EVERY DOCUMENT SHARES ONE ERROR SHAPE: ErrorResponse has_many FieldError. That is the single
    genuinely universal relationship in the estate. See errors/availity-problem-types.yml.
  - >-
    COLLECTION RESPONSES WRAP IN ResultSet. Coverages, Claim Statuses, Service Reviews and
    Configurations each define a ResultSet whose array member is named for the plural resource
    (`coverages`, `claimStatuses`, `serviceReviews`, `configurations`) — the pagination contract
    described in conventions/availity-conventions.yml.
  - >-
    THE BENEFITS GRAPH IS THE DEEPEST STRUCTURE IN THE ESTATE. Coverage -> Benefit -> Amounts ->
    BenefitDetail -> NetworkBenefit is four levels of nesting, and BenefitDetail fans out into
    inNetwork / outOfNetwork / noNetwork / notApplicableNetwork arrays of NetworkBenefit. Anyone
    reading co-pay or deductible values must walk all four network buckets, not just `inNetwork`.
  - >-
    THE DENTAL CLAIM IS THE WIDEST. DentalClaim -> ClaimInformation carries twelve relationships
    including six distinct provider roles (rendering, referring, supervising, assistant surgeon,
    primary care, service facility), and ServiceLine repeats four of those roles at line level.
