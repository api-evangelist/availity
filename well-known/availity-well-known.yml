notes:
  - >-
    DEFECT CORRECTED THIS ROUND: apis.yml previously carried `type: LlmsText` pointing at
    https://developer.availity.com/llms.txt. That URL returns HTTP 200, but the body is the same
    10,700-byte SPA shell the portal returns for every non-existent path — Availity publishes no
    llms.txt. The pointer was false credit and has been removed. A generated llms.txt now lives at
    llms/availity-llms.txt and is wired instead.
  - >-
    Availity's OAuth 2.0 authorization server metadata is not published at
    /.well-known/oauth-authorization-server on any host. The token endpoint is documented in prose
    only, in the public Availity API Guide, and is recorded in authentication/availity-authentication.yml.
