docs: https://availity.github.io/element/
provider: Availity
providerId: availity
summary: >-
  Availity ships two generations of a first-party client-side component estate: Availity Element
  (current — a React design system on Material UI and @availity/design-tokens) and Availity UI Kit
  (previous — Bootstrap 4 SCSS). Both are aimed at applications that RUN INSIDE the Availity
  Essentials portal, not at consumers of the public REST APIs. Availity publishes NO embeddable
  drop-in widget, NO hosted/prebuilt UI surface, NO iframe embed and NO web component that a third
  party could drop into their own site to expose Availity data. Every component below requires a
  React build and portal session context.
scope_note: >-
  This distinction matters for the agent/embedding story. A provider like Stripe ships Elements that
  a stranger can embed with a publishable key; Availity ships an internal design system that
  presumes you are building a portal application under a trading-partner relationship. There is no
  self-serve embed path.
families:
