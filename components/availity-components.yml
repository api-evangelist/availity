    install:
      - npm install @availity/element
      - yarn add @availity/element
    usage_requirement: >-
      Every component must be wrapped in a `ThemeProvider`, normally at the application root, or
      theming does not resolve.
    build_stack:
      monorepo: Nx
      package_manager: Yarn v4
      docs: Storybook
    provides:
      - React UI components (the Availity design system surface)
      - React hooks
      - design tokens for styling
    component_catalog_published: partial
    component_catalog_note: >-
      The Storybook at availity.github.io/element renders the full component catalog client-side;
      the repository README names components only by example (Button) and does not publish a static
      list. No machine-readable component manifest (custom-elements.json or equivalent) is served.
